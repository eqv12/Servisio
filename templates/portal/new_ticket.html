{% extends "base.html" %}
{% block title %}New Ticket - Servisio{% endblock %}
{% block content %}
<h2>Create New Ticket</h2>
<form method="POST">
    <div class="form-group">
        <label>Title</label>
        <input type="text" class="form-control" name="title" id="incident-title" placeholder="Enter issue title">
    </div>
    <div class="form-group mt-3">
        <label>Description</label>
        <textarea class="form-control" name="description" rows="4"></textarea>
    </div>
    <div class="form-group mt-3">
        <label>Priority</label>
        <select class="form-control" name="priority">
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
        </select>
    </div>
    <button type="submit" class="btn btn-primary mt-3">Submit</button>
</form>

<!-- Knowledge Base Suggestions Section -->
<div id="kb-suggestions" class="mt-4" style="display: none;">
    <div class="card">
        <div class="card-header">
            <h5 class="mb-0">
                <i class="fas fa-lightbulb"></i> 
                Suggested Knowledge Base Articles
                <small class="text-muted">- Try these solutions before submitting your ticket</small>
            </h5>
        </div>
        <div class="card-body">
            <div id="suggestions-loading" class="text-center" style="display: none;">
                <div class="spinner-border text-primary" role="status">
                    <span class="sr-only">Loading...</span>
                </div>
                <p class="mt-2">Analyzing your issue and finding relevant solutions...</p>
            </div>
            <div id="suggestions-content">
                <!-- Suggestions will be populated here -->
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const titleInput = document.getElementById('incident-title');
    const suggestionsDiv = document.getElementById('kb-suggestions');
    const loadingDiv = document.getElementById('suggestions-loading');
    const contentDiv = document.getElementById('suggestions-content');
    
    let debounceTimer;
    
    titleInput.addEventListener('blur', function() {
        const title = titleInput.value.trim();
        
        if (title.length < 3) {
            suggestionsDiv.style.display = 'none';
            return;
        }
        
        // Clear previous timer
        clearTimeout(debounceTimer);
        
        // Show loading state
        suggestionsDiv.style.display = 'block';
        loadingDiv.style.display = 'block';
        contentDiv.innerHTML = '';
        
        // Debounce the API call
        debounceTimer = setTimeout(() => {
            console.log('Fetching suggestions for title:', title);
            
            fetch('/api/suggest-articles', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ title: title })
            })
            .then(response => {
                console.log('Response status:', response.status);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                console.log('API response:', data);
                loadingDiv.style.display = 'none';
                
                if (data.error) {
                    contentDiv.innerHTML = `<div class="alert alert-warning">Unable to load suggestions: ${data.error}</div>`;
                    return;
                }
                
                if (data.suggestions && data.suggestions.length > 0) {
                    let html = '<div class="row">';
                    data.suggestions.forEach(article => {
                        html += `
                            <div class="col-md-6 mb-3">
                                <div class="card h-100 border-left-primary kb-suggestions-card">
                                    <div class="card-body">
                                        <h6 class="card-title">
                                            <span class="badge badge-secondary kb-suggestions-badge">${article.category}</span>
                                            ${article.title}
                                        </h6>
                                        <p class="card-text text-muted small">${article.snippet}</p>
                                        <a href="${article.url}" class="btn btn-sm btn-outline-primary" target="_blank">
                                            <i class="fas fa-external-link-alt"></i> View Solution
                                        </a>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    html += '</div>';
                    if (data.fallback) {
                        html += '<div class="alert alert-info mt-2"><small>Showing general articles (AI analysis unavailable)</small></div>';
                    }
                    contentDiv.innerHTML = html;
                } else {
                    contentDiv.innerHTML = '<div class="alert alert-info">No relevant articles found. Please proceed with submitting your ticket.</div>';
                }
            })
            .catch(error => {
                console.error('Error fetching suggestions:', error);
                loadingDiv.style.display = 'none';
                contentDiv.innerHTML = '<div class="alert alert-warning">Unable to load suggestions at this time. Please try again later.</div>';
            });
        }, 500); // Reduced debounce time to 500ms for better UX
    });
    
    // Hide suggestions when user starts typing again
    titleInput.addEventListener('input', function() {
        if (suggestionsDiv.style.display === 'block') {
            suggestionsDiv.style.display = 'none';
        }
    });
});
</script>

{% endblock %}
