{% extends "base.html" %}
{% block title %}User Portal - Servisio{% endblock %}
{% block content %}
<div class="row">
    <div class="col-md-3 mb-4">
        <div class="card p-0" style="background: #f5f5f5; border:none;">
            <div class="card-body text-center" style="background: linear-gradient(135deg, #f9a825 0%, #ff9800 100%); color: #fff; border-radius: 8px 8px 0 0;">
                <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="User" width="80" class="mb-2 rounded-circle bg-white p-1">
                <h5 class="mb-0">{{ current_user.username }}</h5>
                <div style="font-size: 0.95em;">{{ current_user.role }}</div>
            </div>
            <ul class="list-group list-group-flush">
                <li class="list-group-item"><a href="{{ url_for('portal.portal_home') }}" class="text-decoration-none"><i class="bi bi-house-door"></i> Home</a></li>
                </ul>
        </div>
    </div>
    <div class="col-md-9">
        </div>
</div>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
{% endblock %}
