{% extends "base.html" %}
{% block title %}My Tickets - Servisio{% endblock %}
{% block content %}
<h2>My Tickets</h2>
<table class="table table-bordered">
    <thead>
        <tr>
            <th>ID</th><th>Title</th><th>Status</th>
        </tr>
    </thead>
    <tbody>
        {% for ticket in tickets %}
        <tr>
            <td>{{ ticket.id }}</td>
            <td>{{ ticket.title }}</td>
            <td>{{ ticket.status }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
