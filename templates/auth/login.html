<!-- templates/auth/login.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login — Operator Dashboard</title>
    <!-- Bootstrap 5 CSS (assume loaded locally or via CDN in base template) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container">
      <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-12 col-md-8 col-lg-5">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h3 class="card-title mb-3 text-center">Sign in</h3>

              <!-- Flash messages -->
              {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                  <div>
                    {% for category, msg in messages %}
                      <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ msg }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                      </div>
                    {% endfor %}
                  </div>
                {% endif %}
              {% endwith %}

              <form method="post" novalidate>
                <div class="mb-3">
                  <label for="username" class="form-label">Username</label>
                  <input
                    type="text"
                    class="form-control"
                    id="username"
                    name="username"
                    required
                    value="{{ username | default('') }}"
                    autofocus
                  />
                </div>

                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    required
                  />
                </div>

                <div class="mb-3 form-check">
                  <input type="checkbox" class="form-check-input" id="remember" name="remember">
                  <label class="form-check-label" for="remember">Remember me</label>
                </div>

                <div class="d-grid gap-2">
                  <button type="submit" class="btn btn-primary">Sign in</button>
                  <a href="{{ url_for('auth.login') }}" class="btn btn-outline-secondary">Back to Home</a>
                </div>
              </form>

              <hr class="my-3" />

              <div class="text-center small">
                Need an account? Ask an Admin to create one.
                <!-- If you expose register UI, you can link to it here when appropriate -->
              </div>
            </div>
          </div>
          <p class="text-center mt-3 text-muted small">Operator Dashboard</p>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
