<!-- {# 
login.html - Dummy login page template

Purpose:
    Placeholder login form for SmartITSM authentication.
    Frontend developers can style and connect to backend later.

Usage:
    Extends base.html for consistent layout and styling.
#} -->

{% extends "base.html" %}

{% block title %}Login - SmartITSM{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2>Login</h2>
    <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" class="form-control" id="username" name="username" placeholder="Enter username">
        </div>
        <div class="form-group mt-3">
            <label for="password">Password:</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Enter password">
        </div>
        <button type="submit" class="btn btn-primary mt-3">Login</button>
    </form>
    <p class="mt-3">Don't have an account? <a href="#">Register</a></p>
</div>
{% endblock %}
