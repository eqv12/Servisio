<!-- templates/auth/register.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register User — Operator Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
          <div class="card">
            <div class="card-body p-4">
              <h4 class="mb-3">Create new user (Admin only)</h4>
              {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                  {% for category, msg in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                      {{ msg }}
                      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                  {% endfor %}
                {% endif %}
              {% endwith %}

              <form method="post">
                <div class="mb-2">
                  <label class="form-label">Username</label>
                  <input class="form-control" name="username" required>
                </div>
                <div class="mb-2">
                  <label class="form-label">Email</label>
                  <input class="form-control" name="email" type="email">
                </div>
                <div class="mb-2">
                  <label class="form-label">Password</label>
                  <input class="form-control" name="password" type="password" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Role</label>
                  <select name="role" class="form-select">
                    <option value="User" selected>User</option>
                    <option value="Technician">Technician</option>
                    <option value="Admin">Admin</option>
                  </select>
                </div>

                <div class="d-grid gap-2">
                  <button class="btn btn-primary">Create user</button>
                  <a class="btn btn-outline-secondary" href="{{ url_for('index') }}">Cancel</a>
                </div>
              </form>
            </div>
          </div>
          <p class="text-center text-muted small mt-2">Operator Dashboard</p>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
