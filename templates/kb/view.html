{% extends "base.html" %}
{% block title %}{{ article.title }} - KB{% endblock %}
{% block content %}
<h2>{{ article.title }}</h2>
<p class="text-muted">Published: {{ article.created_at.strftime('%Y-%m-%d') }}</p>
<hr>
<pre style="white-space: pre-wrap;">{{ article.content }}</pre>

<form action="{{ url_for('kb.delete_article', id=article.id) }}" method="POST" class="mt-3">
  <button type="submit" class="btn btn-sm btn-danger"
          onclick="return confirm('Delete this article?')">Delete</button>
</form>

{% endblock %}
