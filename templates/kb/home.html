{% extends "base.html" %}
{% block title %}Knowledge Base{% endblock %}
{% block content %}
<h2 class="mb-4">Knowledge Base</h2>

<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">
  {% for cat in categories %}
  <div class="col">
    <a href="{{ url_for('kb.kb_by_category', category=cat) }}" class="text-decoration-none">
      <div class="card h-100 shadow-sm border-0 bg-light hover-shadow">
        <div class="card-body text-center">
          <h4 class="card-title text-primary">{{ cat }}</h4>
          <p class="text-muted small">View articles under {{ cat }}</p>
        </div>
      </div>
    </a>
  </div>
  {% endfor %}
</div>
{% endblock %}
