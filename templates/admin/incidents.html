{% extends "base.html" %}
{% block title %}Incident Management - Servisio{% endblock %}
{% block content %}
<h2>Incident Management</h2>
<table class="table table-striped">
    <thead><tr><th>ID</th><th>Title</th><th>Status</th><th>Priority</th></tr></thead>
    <tbody>
        {% for i in incidents %}
        <tr>
            <td>{{ i.id }}</td>
            <td>{{ i.title }}</td>
            <td>{{ i.status }}</td>
            <td>{{ i.priority }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
