<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; }
        .container { width: 90%; margin: auto; padding: 20px; }
        .header { font-size: 24px; color: #4f46e5; }
        .content { margin-top: 20px; }
        .footer { margin-top: 30px; font-size: 12px; color: #777; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">Your Account is Active!</div>
        <div class="content">
            <p>Hi {{ user.username }},</p>
            <p>Your Servisio account has been approved by an administrator. You can now log in using the username and password you registered with.</p>
            <p>Welcome to Servisio!</p>
        </div>
        <div class="footer">
            <p>This is an automated message from Servisio.</p>
        </div>
    </div>
</body>
</html>
